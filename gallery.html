<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- PREVENT SEARCH ENGINES FROM INDEXING -->
  <meta name="robots" content="noindex, nofollow">
  
  <title>Exclusive Art Vault | Book Illustrations</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#09070F',
              card: '#130F23',
              border: '#2A1F4D',
              purple: '#8B5CF6',
              neon: '#A78BFA',
              accent: '#C084FC'
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-brand-bg text-slate-200 antialiased min-h-screen">

  <!-- HEADER -->
  <header class="py-16 px-6 text-center border-b border-brand-border/40 relative">
    <div class="max-w-3xl mx-auto">
      <span class="text-xs font-bold tracking-widest uppercase text-brand-neon bg-brand-purple/10 border border-brand-purple/30 px-3.5 py-1 rounded-full inline-block mb-3">
        Reader Exclusive
      </span>
      <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">The Art Vault</h1>
      <p class="text-slate-400 text-sm md:text-base mt-2">
        Full-color, high-resolution original illustrations and concept art from the series. Click any image to expand.
      </p>
    </div>
  </header>

  <!-- GALLERY GRID -->
  <main class="max-w-6xl mx-auto px-6 py-12">
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

      <!-- ITEM 1 -->
      <div class="group relative cursor-pointer overflow-hidden rounded-xl bg-brand-card border border-brand-border/60 hover:border-brand-neon transition" onclick="openLightbox(0)">
        <img src="https://placehold.co/1200x800/161129/C084FC?text=Art+01:+Nebula+Gate" alt="The Nebula Gate" class="w-full aspect-square object-cover group-hover:scale-105 transition duration-300">
        <div class="p-3 bg-brand-card/90">
          <h3 class="text-xs font-bold text-white truncate">The Nebula Gate</h3>
          <p class="text-[11px] text-slate-400">Chapter 4</p>
        </div>
      </div>

      <!-- ITEM 2 -->
      <div class="group relative cursor-pointer overflow-hidden rounded-xl bg-brand-card border border-brand-border/60 hover:border-brand-neon transition" onclick="openLightbox(1)">
        <img src="https://placehold.co/1200x800/161129/C084FC?text=Art+02:+Taliah" alt="Taliah Character Concept" class="w-full aspect-square object-cover group-hover:scale-105 transition duration-300">
        <div class="p-3 bg-brand-card/90">
          <h3 class="text-xs font-bold text-white truncate">Taliah Character Portrait</h3>
          <p class="text-[11px] text-slate-400">Concept Art</p>
        </div>
      </div>

      <!-- ITEM 3 -->
      <div class="group relative cursor-pointer overflow-hidden rounded-xl bg-brand-card border border-brand-border/60 hover:border-brand-neon transition" onclick="openLightbox(2)">
        <img src="https://placehold.co/1200x800/161129/C084FC?text=Art+03:+The+Corvette" alt="The Starlight Cruiser" class="w-full aspect-square object-cover group-hover:scale-105 transition duration-300">
        <div class="p-3 bg-brand-card/90">
          <h3 class="text-xs font-bold text-white truncate">The Starlight Cruiser</h3>
          <p class="text-[11px] text-slate-400">Ship Blueprints</p>
        </div>
      </div>

      <!-- ITEM 4 -->
      <div class="group relative cursor-pointer overflow-hidden rounded-xl bg-brand-card border border-brand-border/60 hover:border-brand-neon transition" onclick="openLightbox(3)">
        <img src="https://placehold.co/1200x800/161129/C084FC?text=Art+04:+Ruins" alt="Alien Ruins" class="w-full aspect-square object-cover group-hover:scale-105 transition duration-300">
        <div class="p-3 bg-brand-card/90">
          <h3 class="text-xs font-bold text-white truncate">The Obsidian Citadel</h3>
          <p class="text-[11px] text-slate-400">Chapter 18</p>
        </div>
      </div>

      <!-- DUPLICATE AS MANY ITEMS AS NEEDED -->

    </div>
  </main>

  <!-- LIGHTBOX MODAL -->
  <div id="lightbox" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col items-center justify-center p-4 backdrop-blur-md select-none">
    
    <!-- Top Controls -->
    <div class="absolute top-4 right-6 flex gap-4 text-white z-50">
      <button onclick="closeLightbox()" class="text-slate-400 hover:text-white text-2xl font-bold p-2">&times; Close</button>
    </div>

    <!-- Navigation Arrows -->
    <button onclick="prevImage()" class="absolute left-4 top-1/2 -translate-y-1/2 text-white/70 hover:text-white p-4 text-3xl font-bold z-50">&#10094;</button>
    <button onclick="nextImage()" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/70 hover:text-white p-4 text-3xl font-bold z-50">&#10095;</button>

    <!-- Main Image Display -->
    <div class="max-w-5xl max-h-[80vh] flex flex-col items-center justify-center">
      <img id="lightbox-img" src="" alt="" class="max-h-[75vh] max-w-full rounded-lg shadow-2xl object-contain border border-brand-border/40">
      <div class="text-center mt-4">
        <h3 id="lightbox-title" class="text-white font-bold text-base"></h3>
        <p id="lightbox-caption" class="text-slate-400 text-xs mt-1"></p>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX SCRIPT -->
  <script>
    // EDIT HERE: Add all your images, titles, and captions to this array
    const galleryData = [
      {
        src: "https://placehold.co/1200x800/161129/C084FC?text=Art+01:+Nebula+Gate",
        title: "The Nebula Gate",
        caption: "Full colored rendition of the spatial rift described in Chapter 4."
      },
      {
        src: "https://placehold.co/1200x800/161129/C084FC?text=Art+02:+Taliah",
        title: "Taliah Character Portrait",
        caption: "Original character concept artwork."
      },
      {
        src: "https://placehold.co/1200x800/161129/C084FC?text=Art+03:+The+Corvette",
        title: "The Starlight Cruiser",
        caption: "Detailed exterior rendering of the class-4 vessel."
      },
      {
        src: "https://placehold.co/1200x800/161129/C084FC?text=Art+04:+Ruins",
        title: "The Obsidian Citadel",
        caption: "Surface landscape of the dead world from Chapter 18."
      }
    ];

    let currentIndex = 0;

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      document.getElementById('lightbox').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    function updateLightbox() {
      const item = galleryData[currentIndex];
      document.getElementById('lightbox-img').src = item.src;
      document.getElementById('lightbox-title').textContent = item.title;
      document.getElementById('lightbox-caption').textContent = item.caption;
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % galleryData.length;
      updateLightbox();
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + galleryData.length) % galleryData.length;
      updateLightbox();
    }

    // Keyboard support (ESC, Left, Right)
    document.addEventListener('keydown', (e) => {
      const lightbox = document.getElementById('lightbox');
      if (!lightbox.classList.contains('hidden')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === 'ArrowLeft') prevImage();
      }
    });
  </script>
</body>
</html>
